name: Build and Deploy

on:
  push:
    branches: [dev-hemel]
    url: https://studio.brainchat.cloud # Update with your actual domain

# Hard-coding the lowercase name here is the safest "short" solution
env:
  REGISTRY: ghcr.io
  # Replace 'naimdotcom' with your GitHub username if it is different
  LOW_IMG: ghcr.io/naimdotcom/missionx-client

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.LOW_IMG }}:latest
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
            VITE_AUTH_URL=${{ secrets.VITE_AUTH_URL }}
            VITE_APP_URL=${{ secrets.VITE_APP_URL }}
            VITE_CHANNEL_URL=${{ secrets.VITE_CHANNEL_URL }}
            VITE_META_APP_ID=${{ secrets.VITE_META_APP_ID }}

     - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GH_PAT, LOW_IMG  # Pass these into the SSH session
          script: |
            # Use the variable passed through envs
            echo "$GH_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull $LOW_IMG:latest

            docker stop missionx-client || true
            docker rm missionx-client || true

            docker run -d \
              --name missionx-client \
              -p 3000:80 \
              --restart unless-stopped \
              $LOW_IMG:latest

            docker image prune -f
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LOW_IMG: ${{ env.LOW_IMG }}
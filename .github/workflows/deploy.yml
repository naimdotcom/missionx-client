name: Build and Deploy
on:
  push:
    branches: [dev-hemel]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v4

      # Fixes the 'Lowercase' requirement
      - name: Set Image Name
        run: echo "IMG=ghcr.io/${{ github.repository_owner }}/missionx-client" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Login & Build
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Registry
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.IMG }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login and Pull
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMG }}:latest

            # Restart Container
            docker stop missionx-client || true && docker rm missionx-client || true
            docker run -d --name missionx-client -p 3000:80 --restart unless-stopped ${{ env.IMG }}:latest

            # Clean old images
            docker image prune -f

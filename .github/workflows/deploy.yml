name: Deploy Dockerized Front-End

on:
  push:
    branches: [dev-hemel]

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: your-docker-hub-user/repo-name:latest
          # Pass the GitHub Secrets into the Docker build process
          build-args: |
            - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
            - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
            - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
            - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
            - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
            - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
            - VITE_API_BASE_URL=${VITE_API_BASE_URL}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login to GHCR on the server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            # Stop and remove the old container
            docker stop my-frontend || true
            docker rm my-frontend || true
            # Pull the latest image
            docker pull ghcr.io/${{ github.repository }}:latest
            # Run the new container (Mapping port 8080 inside to 3000 outside, for example)
            docker run -d --name my-frontend -p 3000:80 ghcr.io/${{ github.repository }}:latest

  deploy-production:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: https://your-domain.com  # Update with your actual domain
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t nextjs-app:prod-${{ github.sha }} \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }} \
            --build-arg NEXT_PUBLIC_FIREBASE_API_HOSTING=${{ secrets.FIREBASE_API_HOSTING }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            .
          docker save nextjs-app:prod-${{ github.sha }} | gzip > app-prod.tar.gz
      
      - name: Copy Docker image to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "app-prod.tar.gz"
          target: "/home/${{ secrets.VPS_USERNAME }}/apps/production"
      
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/apps/production
            
            # Load new Docker image
            docker load < app-prod.tar.gz
            
            # Stop and remove old container
            docker stop nextjs-prod || true
            docker rm nextjs-prod || true
            
            # Run new container
            docker run -d \
              --name nextjs-prod \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              nextjs-app:prod-${{ github.sha }}
            
            # Clean up
            docker image prune -af --filter "until=24h"
            rm app-prod.tar.gz
            
            echo "Production deployed successfully! 🚀"
            
            # Wait for container to start
            sleep 5
            
            # Check if container is running
            if [ $(docker ps -q -f name=nextjs-prod) ]; then
              echo "Container is running ✅"
              docker ps -f name=nextjs-prod
            else
              echo "Container failed to start "
              docker logs nextjs-prod
              exit 1
            fi
      
      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Image: nextjs-app:prod-${{ github.sha }}"
          echo "🌐 URL: https://your-domain.com"
          echo "🕒 Time: $(date)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "Please check the logs above for details."
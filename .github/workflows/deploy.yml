name: Build and Deploy

on:
  push:
    branches: [dev-hemel]

# Hard-coding the lowercase name here is the safest "short" solution
env:
  REGISTRY: ghcr.io
  # Replace 'naimdotcom' with your GitHub username if it is different
  LOW_IMG: ghcr.io/naimdotcom/missionx-client

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.LOW_IMG }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Login using the GH_PAT you added to Secrets
            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull the new image
            docker pull ${{ env.LOW_IMG }}:latest

            # 3. Stop and Remove the old container
            docker stop missionx-client || true
            docker rm missionx-client || true

            # 4. Run the new container
            # We use 3000:80 assuming your Dockerfile uses Nginx (Internal port 80)
            docker run -d \
              --name missionx-client \
              -p 3000:80 \
              --restart unless-stopped \
              ${{ env.LOW_IMG }}:latest

            # 5. Cleanup old images to save disk space
            docker image prune -f

name: Deploy to VPS (Optimized)

on:
  push:
    branches:
      - production
      # - staging

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: https://brainchat.cloud
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Build on VPS directly instead of GitHub Actions
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 20m
          script: |
            set -e
            
            APP_DIR="/home/${{ secrets.VPS_USERNAME }}/apps/production"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            # Create app directory if it doesn't exist
            mkdir -p $APP_DIR
            cd $APP_DIR
            
            # Clone or pull latest code
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes..."
              git fetch origin production
              git reset --hard origin/production
            else
              echo "📥 Cloning repository..."
              git clone --single-branch --branch production $REPO_URL .
            fi
            
            # Create .env file with secrets
            cat > .env.local << EOF
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_FIREBASE_API_HOSTING=${{ secrets.FIREBASE_API_HOSTING }}
            NEXT_PUBLIC_BASE_API_URL=${{ secrets.NEXT_PUBLIC_BASE_API_URL }}
            NODE_ENV=production
            EOF
            
            # Build Docker image on VPS (uses cache layers)
            echo "🔨 Building Docker image..."
            docker build \
              -t nextjs-app:production \
              -t nextjs-app:prod-${{ github.sha }} \
              --cache-from nextjs-app:production \
              .
            
            # Zero-downtime deployment with health check
            echo "🚀 Deploying new container..."
            
            # Start new container on different port
            docker run -d \
              --name nextjs-prod-new \
              --restart unless-stopped \
              -p 3001:3000 \
              --env-file .env.local \
              nextjs-app:prod-${{ github.sha }}
            
            # Wait for new container to be healthy
            echo "⏳ Waiting for new container to start..."
            sleep 10
            
            # Simple health check
            for i in {1..30}; do
              if curl -f http://localhost:3001 > /dev/null 2>&1; then
                echo "✅ New container is healthy!"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Health check failed!"
                docker logs nextjs-prod-new
                docker stop nextjs-prod-new
                docker rm nextjs-prod-new
                exit 1
              fi
              sleep 2
            done
            
            # Swap containers (zero downtime)
            docker stop nextjs-prod || true
            docker rm nextjs-prod || true
            docker stop nextjs-prod-new
            docker rename nextjs-prod-new nextjs-prod
            
            # Update port mapping
            docker run -d \
              --name nextjs-prod-temp \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file .env.local \
              nextjs-app:prod-${{ github.sha }}
            
            docker stop nextjs-prod
            docker rm nextjs-prod
            docker rename nextjs-prod-temp nextjs-prod
            
            # Cleanup old images (keep last 3)
            docker images nextjs-app --format "{{.Tag}}" | grep "prod-" | tail -n +4 | xargs -r -I {} docker rmi nextjs-app:{} || true
            docker image prune -f
            
            # Remove .env file for security
            rm .env.local
            
            echo "🎉 Production deployed successfully!"
            echo "📦 Image: nextjs-app:prod-${{ github.sha }}"
            echo "🕒 Time: $(date)"
            
            # Show running container
            docker ps -f name=nextjs-prod --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      
      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 Commit: ${{ github.sha }}"
          echo "🌐 URL: https://brainchat.cloud"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "🕒 Time: $(date)"
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "📝 Check the logs above for details"
          echo "🔄 Rollback may be needed"